plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "com.facebook.react"
  id "com.google.gms.google-services"
}

apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

def keystorePropertiesFile = file("../keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

react {
  autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
  compileSdkVersion rootProject.ext.compileSdkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  ndkVersion rootProject.ext.ndkVersion

  namespace "com.kinover_frontend"
  defaultConfig {
    applicationId "com.kinover_frontend"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 89
    versionName "1.0.2"
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
    manifestPlaceholders = [
      kakaoNativeAppKey: (project.env.get("KAKAO_NATIVE_APP_KEY") ?: "")
    ]
    // @react-native-seoul/kakao-login: RNKakaoLoginsModule init이 R.string.kakao_app_key로 KakaoSdk.init을 다시 호출함.
    // 라이브러리 기본 kakao_strings.xml(샘플/dooboolab 앱 키)이 병합되지 않도록 앱 모듈에서 덮어씀.
    resValue "string", "kakao_app_key", (project.env.get("KAKAO_NATIVE_APP_KEY") ?: "")
  }
  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    release {
      if (keystorePropertiesFile.exists()) {
        storeFile file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
      }
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled enableProguardInReleaseBuilds
      if (keystorePropertiesFile.exists()) {
        signingConfig signingConfigs.release
      }
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
  }

  packaging {
    resources {
      excludes += ["builddef.lst"]
    }
    jniLibs {
      useLegacyPackaging = false
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("com.kakao.sdk:v2-user:2.21.3")
  implementation("com.google.firebase:firebase-messaging:23.4.1")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

configurations.all {
  exclude group: "com.caverock", module: "androidsvg"
}
